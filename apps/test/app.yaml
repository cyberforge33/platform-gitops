apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-app
  namespace: argocd
spec:
  project: platform-project

  source:
    repoURL: https://github.com/cyberforge33/platform-gitops.git
    targetRevision: develop
    path: apps/test/workloads

  destination:
    server: https://kubernetes.default.svc
    namespace: test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true