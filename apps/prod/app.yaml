apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-app
  namespace: argocd
spec:
  project: platform-project

  source:
    repoURL: https://github.com/cyberforge33/platform-gitops.git
    targetRevision: main
    path: apps/prod/workloads

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true