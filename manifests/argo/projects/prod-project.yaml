apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
spec:
  description: Production environment

  sourceRepos:
    - 'https://github.com/YOUR-REPO.git'   # 🔴 restrict in prod

  destinations:
    - namespace: prod
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: apps
      kind: Deployment